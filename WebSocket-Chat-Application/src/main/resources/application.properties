server.port=6369

# JWT signing (HMAC-SHA256). Supply a Base64-encoded secret of at least 32 bytes via JWT_SECRET,
# e.g. `openssl rand -base64 32`. If unset, a random key is generated at startup
# (fine for local dev; tokens stop working after a restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=websocket-chat
app.jwt.ttl=PT1H

# Optional admin account (role ADMIN) seeded at startup when both values are set.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
